name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/run_tests.py
      - run: python tools/check_repo.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: imrc-release-candidate
          path: dist/
          if-no-files-found: error
